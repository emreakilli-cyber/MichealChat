<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>MICHEAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131315">
<!-- PWA kabuğu: ana ekrandan tam ekran, Safari çubuğu gizli -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MICHEAL">
<meta name="mobile-web-app-capable" content="yes">
<!-- Gömülü SVG apple-touch-icon (M harfi, ofis accent sarısı) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Crect%20width='180'%20height='180'%20rx='40'%20fill='%23131315'/%3E%3Crect%20x='10'%20y='10'%20width='160'%20height='160'%20rx='32'%20fill='none'%20stroke='%236B5620'%20stroke-width='2'/%3E%3Ctext%20x='90'%20y='120'%20font-family='monospace'%20font-size='96'%20font-weight='800'%20text-anchor='middle'%20fill='%23FFD165'%3EM%3C/text%3E%3C/svg%3E">
<style>
/* ===== Munder Difflin karanlık teması — app.asar --cth-* değişkenleri ===== */
:root{
  --cth-cream-50:#131315; --cth-cream-100:#1B1B1E; --cth-cream-200:#232326; --cth-cream-300:#2A2A2E;
  --cth-paper-100:#1B1B1E; --cth-paper-200:#202023;
  --cth-ink-900:#ECEAE3; --cth-ink-700:#C9C6BE; --cth-ink-500:#8E8B83;
  --cth-accent:#FFD165; --cth-accent-hover:#FFE08F; --cth-accent-ink:#17150E;
  --cth-accent-text:#FFCA54; --cth-accent-soft:#3A2F12; --cth-accent-line:#6B5620;
  --cth-sky:#7DB8E4; --cth-sky-light:#1F3238;
  --cth-control-quiet:#1B1B1E; --cth-control-base:#232326; --cth-control-raised:#2A2A2E;
  --cth-control-strong:#33333A; --cth-surface-active:#26262A; --cth-connector:#3D3D43;
  --cth-shadow-hard:0 8px 24px rgba(0,0,0,.45);
  --cth-font-ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --cth-font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --cth-font-display:"Press Start 2P",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--cth-cream-50); color:var(--cth-ink-900);
  font-family:var(--cth-font-ui); font-size:15px; line-height:1.4;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* ---- Üst başlık ---- */
header{
  flex:0 0 auto; background:var(--cth-cream-100);
  border-bottom:1px solid var(--cth-connector);
  padding:12px 16px calc(12px) 16px; box-shadow:var(--cth-shadow-hard);
  display:flex; align-items:center; gap:10px;
}
.ava{width:34px;height:34px;flex:0 0 auto;border-radius:8px;
  border:1px solid var(--cth-connector);background:var(--cth-control-base);
  image-rendering:pixelated;image-rendering:crisp-edges}
.htxt{flex:1;min-width:0}
h1{margin:0;font-family:var(--cth-font-display);font-size:13px;letter-spacing:1px;
  color:var(--cth-accent-text);text-transform:uppercase;line-height:1.3}
.sub{margin-top:4px;font-family:var(--cth-font-mono);font-size:10px;color:var(--cth-ink-500);
  text-transform:uppercase;letter-spacing:.5px}

/* ---- Mesaj listesi ---- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.empty{margin:auto;text-align:center;color:var(--cth-ink-500);font-size:13px;
  font-family:var(--cth-font-mono);max-width:260px}
.row{display:block;width:100%;min-width:0}
.row.emre{text-align:right}
.row.michael{text-align:left}
.bubble{display:inline-block;text-align:left;max-width:82%;
  padding:9px 12px;border-radius:12px;border:1px solid var(--cth-connector);
  white-space:pre-wrap;word-break:break-word;font-size:15px}
/* Emre balonu = accent sarısı (giden) */
.emre .bubble{background:var(--cth-accent);color:var(--cth-accent-ink);
  border-color:var(--cth-accent-line);border-bottom-right-radius:4px}
/* Michael balonu = kart + sky kenar (gelen) */
.michael .bubble{background:var(--cth-control-raised);color:var(--cth-ink-900);
  border-color:var(--cth-connector);border-left:3px solid var(--cth-sky);
  border-bottom-left-radius:4px}
.meta{margin-top:3px;font-family:var(--cth-font-mono);font-size:9px;color:var(--cth-ink-500);
  text-transform:uppercase;letter-spacing:.5px;padding:0 4px}

/* ---- Alt yazma kutusu ---- */
footer{flex:0 0 auto;background:var(--cth-cream-100);border-top:1px solid var(--cth-connector);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
  display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:120px;min-height:42px;
  background:var(--cth-control-base);color:var(--cth-ink-900);
  border:1px solid var(--cth-connector);border-radius:10px;
  padding:10px 12px;font-family:var(--cth-font-ui);font-size:15px;line-height:1.35;outline:none}
textarea:focus{border-color:var(--cth-accent);box-shadow:0 0 0 2px rgba(255,201,79,.25)}
button{flex:0 0 auto;height:42px;padding:0 18px;border:1px solid var(--cth-accent-line);
  border-radius:10px;background:var(--cth-accent);color:var(--cth-accent-ink);
  font-family:var(--cth-font-display);font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  cursor:pointer}
button:active{background:var(--cth-accent-hover)}
button:disabled{opacity:.4}
</style>
</head>
<body>
<header>
  <img class="ava" src="michael.png" alt="Micheal" width="34" height="34">
  <div class="htxt">
    <h1>MICHEAL</h1>
    <div class="sub" id="sub">SON GÜNCELLEME —</div>
  </div>
</header>

<main id="list"><div class="empty" id="empty">Henüz mesaj yok.<br>Aşağıdan yaz, kestirme WhatsApp'ta Michael'a gönderir.</div></main>

<footer>
  <textarea id="inp" placeholder="Michael'a yaz…" rows="1" autocomplete="off"></textarea>
  <button id="send" type="button">GÖNDER</button>
</footer>

<script>
(function(){
  "use strict";
  var KEY="mc-mesajlar", MAX=500;
  var list=document.getElementById("list"),
      inp=document.getElementById("inp"),
      btn=document.getElementById("send"),
      sub=document.getElementById("sub"),
      empty=document.getElementById("empty");

  // gizli gist ham adresi (jeton yok; kimlik doğrulamasız okunur)
  var GIST="https://gist.githubusercontent.com/emreakilli-cyber/44a280481043c781c59857e6389f5ef5/raw/MichealChat";
  var lastSync=0;

  // ---- depolama (localStorage; erişilemezse bellekte) ----
  var mem=[];
  function load(){
    try{ var r=localStorage.getItem(KEY); mem=r?JSON.parse(r):[]; if(!Array.isArray(mem))mem=[]; }
    catch(e){ mem=[]; }
  }
  function save(){
    if(mem.length>MAX) mem=mem.slice(mem.length-MAX);
    try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){}
  }
  // metin+zaman özeti → id (djb2)
  function hash(s){ var h=5381,i=s.length; while(i) h=(h*33)^s.charCodeAt(--i); return (h>>>0).toString(36); }
  function mkId(text,ts){ return hash(text+"|"+ts); }

  function fmt(ts){
    try{ return new Date(ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ return ""; }
  }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  function render(){
    list.querySelectorAll(".row").forEach(function(n){n.remove();});
    if(!mem.length){ empty.style.display="block"; }
    else{
      empty.style.display="none";
      mem.forEach(function(m){
        var row=document.createElement("div");
        row.className="row "+(m.from==="emre"?"emre":"michael");
        row.innerHTML='<div class="bubble">'+esc(m.text)+'</div>'+
          '<div class="meta">'+(m.from==="emre"?"EMRE":"MICHEAL")+" · "+fmt(m.ts)+'</div>';
        list.appendChild(row);
      });
    }
    syncLabel();
    list.scrollTop=list.scrollHeight;
  }

  // başlık saati: başarılı çekiş varsa onu, yoksa son mesaj saatini göster
  function syncLabel(){
    var t=lastSync||(mem.length?mem[mem.length-1].ts:null);
    sub.textContent="SON GÜNCELLEME "+(t?fmt(t):"—");
  }

  function add(from,text,ts){
    text=(text||"").trim(); if(!text) return false;
    ts=ts||Date.now();
    var id=mkId(text,ts);
    // yinelenme koruması: aynı id ya da 5 sn içinde aynı metin
    for(var i=mem.length-1;i>=0 && i>mem.length-8;i--){
      if(mem[i].id===id) return false;
      if(mem[i].from===from && mem[i].text===text && Math.abs(mem[i].ts-ts)<5000) return false;
    }
    mem.push({id:id,from:from,text:text,ts:ts});
    save(); render(); return true;
  }

  // ---- GELEN: #in=<urlencoded> ----
  function readIncoming(){
    var h=location.hash||"";
    var m=h.match(/[#&]in=([^&]*)/);
    if(!m) return;
    var txt="";
    try{ txt=decodeURIComponent(m[1].replace(/\+/g," ")); }catch(e){ txt=m[1]; }
    // URL'yi temizle (aynı mesaj iki kez eklenmesin)
    try{ history.replaceState(null,"",location.pathname+location.search); }
    catch(e){ location.hash=""; }
    add("michael",txt,Date.now());
  }

  // ---- GELEN (asıl): gist'ten çek ----
  function hasId(id){ for(var i=0;i<mem.length;i++) if(mem[i].id===id) return true; return false; }
  function ingest(arr){
    if(!Array.isArray(arr)) return;
    var changed=false;
    for(var i=0;i<arr.length;i++){
      var it=arr[i]; if(!it || it.text==null) continue;
      var txt=String(it.text); if(!txt.trim()) continue;
      var ts=it.ts||Date.now();
      var id=it.id||mkId(txt,ts);
      if(hasId(id)) continue;
      mem.push({id:id,from:"michael",text:txt,ts:ts});
      changed=true;
    }
    if(changed){ mem.sort(function(a,b){return (a.ts||0)-(b.ts||0);}); save(); render(); }
  }
  var polling=false;
  function pollGist(){
    if(polling) return; polling=true;
    fetch(GIST+"?t="+Date.now(),{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(data){ ingest(data); lastSync=Date.now(); syncLabel(); })
      .catch(function(){ /* ağ hatası: sessiz, sonraki turda yeniden dene */ })
      .then(function(){ polling=false; });
  }
  var pollTimer=null;
  function startPoll(){ if(pollTimer) return; pollGist(); pollTimer=setInterval(pollGist,10000); }
  function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

  // ---- GİDEN: kestirmeyi tetikle ----
  function sendOut(){
    var t=inp.value.trim(); if(!t) return;
    add("emre",t,Date.now());
    inp.value=""; autosize();
    var url="shortcuts://run-shortcut?name="+encodeURIComponent("Michaele-Yaz")+
            "&input=text&text="+encodeURIComponent(t);
    location.href=url;
  }

  function autosize(){ inp.style.height="auto"; inp.style.height=Math.min(inp.scrollHeight,120)+"px"; }

  btn.addEventListener("click",sendOut);
  inp.addEventListener("input",autosize);
  inp.addEventListener("keydown",function(e){
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendOut(); }
  });
  window.addEventListener("hashchange",readIncoming);
  // sayfa geri geldiğinde (kestirme dönüşü) yeni #in olabilir
  window.addEventListener("pageshow",readIncoming);
  // sekme arkaplandayken çekmeyi durdur; öne gelince hemen bir kere çek
  document.addEventListener("visibilitychange",function(){
    if(document.hidden) stopPoll(); else startPoll();
  });

  load(); render(); readIncoming();
  if(!document.hidden) startPoll();
})();
</script>
</body>
</html>
